name: Build Kayla's Library Engine Beta IPA

on:
  workflow_dispatch:
  push:
    branches:
      - beta/reader-engine-v2
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'mobile/**'
      - 'ios/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '*config*'
      - 'env.d.ts'
      - '.github/workflows/engine-beta-ios.yml'

permissions:
  contents: read

concurrency:
  group: engine-beta-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Test Engine V2 and bundle beta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_ENGINE_BETA_BUILD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:mobile
      - run: npx tsx scripts/verify-engine-beta.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-beta-web-${{ github.run_number }}
          path: www/
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build unsigned Engine Beta IPA
    needs: web
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      VITE_ENGINE_BETA_BUILD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: engine-beta-web-${{ github.run_number }}
          path: www/
      - run: xcodebuild -version
      - run: npx cap sync ios
      - name: Validate beta project files
        run: |
          plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Archive isolated Engine Beta
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/EngineBeta.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            2>&1 | tee build/xcodebuild.log
      - name: Package and verify beta IPA
        run: bash scripts/package-engine-beta-ipa.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kaylas-Library-Engine-Beta-unsigned-${{ github.run_number }}
          path: |
            build/Kaylas-Library-Engine-Beta-unsigned.ipa
            build/Kaylas-Library-Engine-Beta-unsigned.ipa.sha256
            docs/ENGINE-BETA-MILESTONE-1.md
            docs/ENGINE-BETA-MILESTONE-2.md
          if-no-files-found: error
          retention-days: 30
      - name: Keep compilation log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Engine-Beta-build-log-${{ github.run_number }}
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
